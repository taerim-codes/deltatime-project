<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시간의흐름 — delta time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14110E; --ink:#161514; --paper:#FBFAF7; --smoke:#8A857D;
    --serif:'Gowun Batang','Noto Serif KR',serif;
    --sans:'Noto Sans KR',sans-serif;
    --mono:'IBM Plex Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);font-weight:300;line-height:1.8;letter-spacing:-0.01em;background:var(--bg);color:var(--paper)}
  body.detail-mode{overflow:hidden}
  ::selection{background:var(--paper);color:var(--ink)}
  a:focus-visible,button:focus-visible{outline:2px solid currentColor;outline-offset:4px;border-radius:2px}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}

  header{
    position:fixed;top:0;left:0;right:0;z-index:10;
    display:flex;justify-content:space-between;align-items:baseline;
    padding:1.5rem 5vw;
    background:linear-gradient(var(--bg) 40%,transparent);
    pointer-events:none;
  }
  header a{pointer-events:auto}
  .wordmark{font-family:var(--serif);font-size:1.1rem;font-weight:700;letter-spacing:.06em;text-decoration:none;color:var(--paper)}
  .wordmark span{font-family:var(--mono);font-size:.6rem;font-weight:400;letter-spacing:.22em;opacity:.45;margin-left:.6rem}
  .tag{font-family:var(--mono);font-size:.58rem;letter-spacing:.26em;opacity:.45}

  .hero{padding:26vh 5vw 14vh;text-align:center}
  .hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.6rem,3.8vw,2.6rem);line-height:1.7}
  .hero p{font-family:var(--mono);font-size:.6rem;letter-spacing:.3em;opacity:.45;margin-top:2.2rem}

  .stack{display:flex;flex-direction:column;align-items:center;padding:0 5vw 6rem}
  .grp{font-family:var(--mono);font-size:.6rem;letter-spacing:.34em;opacity:.4;margin:9rem 0 7rem;text-align:center}
  .grp:first-child{margin-top:0}
  .grp em{font-style:normal;display:block;font-family:var(--serif);font-size:1.05rem;letter-spacing:.14em;opacity:.9;margin-top:.5rem}

  .pbook{
    width:min(680px,88vw);margin-bottom:8.5rem;
    opacity:0;transform:translateY(34px);
    transition:opacity .9s ease, transform .9s cubic-bezier(.22,.9,.3,1);
    filter:drop-shadow(0 34px 30px rgba(0,0,0,.5));
  }
  .pbook.in{opacity:1;transform:none}
  .pbook:hover,.pbook:focus-visible{filter:drop-shadow(0 46px 38px rgba(0,0,0,.55))}
  .pwrap{position:relative;display:block;perspective:1700px;transition:transform .5s cubic-bezier(.22,.9,.3,1)}
  .pbook:hover .pwrap,.pbook:focus-visible .pwrap{transform:translateY(-9px)}
  .ptop{
    position:absolute;bottom:100%;left:0;right:0;height:auto;aspect-ratio:436/284;
    transform-origin:50% 100%;transform:rotateX(60deg);
    overflow:hidden;border-radius:2px 2px 0 0;
  }
  .ptop img{
    position:absolute;top:50%;left:50%;
    width:calc(100% * 284 / 436);height:calc(100% * 436 / 284);
    transform:translate(-50%,-50%) rotate(90deg);object-fit:cover;
  }
  .ptop::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to top, rgba(255,255,255,.06), rgba(0,0,0,.22));
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);
  }
  .pspine{
    position:relative;z-index:2;height:var(--sh,76px);
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1rem;
    padding:0 1.8rem;border-radius:2px;
  }
  .pspine::after{
    content:"";position:absolute;inset:0;border-radius:2px;pointer-events:none;
    background:linear-gradient(to bottom, rgba(255,255,255,.14), rgba(255,255,255,0) 34%, rgba(0,0,0,.16));
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);
  }
  .pspine .pa{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;opacity:.75;justify-self:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .pspine .pt{font-family:var(--serif);font-weight:400;font-size:clamp(.95rem,2.2vw,1.28rem);letter-spacing:.12em;text-align:center;line-height:1.35}
  .pspine .pl{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;opacity:.55;justify-self:end}
  .pedge{
    display:block;height:7px;width:calc(100% - 14px);margin:0 auto;
    background:repeating-linear-gradient(to right,#EFECE3 0 3px,#DAD6CA 3px 4px);
    border-radius:0 0 3px 3px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.35);
  }

  .chainline{padding:2rem 5vw 8rem;text-align:center;font-family:var(--mono);font-size:.6rem;letter-spacing:.26em;opacity:.4}
  footer{
    padding:3rem 5vw 4rem;border-top:1px solid rgba(255,255,255,.08);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;
    font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;opacity:.55;
  }
  footer a{color:var(--paper);text-decoration:none}

  /* ================= detail : 책의 색으로 물드는 페이지 ================= */
  .detail{
    position:fixed;inset:0;z-index:20;display:none;overflow-y:auto;
    background:var(--dbg,#FBFAF7);color:var(--dfg,#161514);
    transition:background .5s ease;
  }
  body.detail-mode .detail{display:block;animation:dfade .5s ease}
  @keyframes dfade{from{opacity:0}to{opacity:1}}
  .back{
    position:fixed;top:1.6rem;left:5vw;z-index:25;
    font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;color:inherit;
    padding:.4rem .6rem .4rem 0;
  }
  .back:hover{opacity:.6}
  .detail-inner{
    min-height:100vh;display:grid;grid-template-columns:.95fr 1.05fr;
    gap:5rem;align-items:center;padding:8rem 8vw 6rem;
  }
  .stage{perspective:1900px;display:flex;justify-content:center;position:relative}
  .fwrap{animation:floatin 1s cubic-bezier(.22,.9,.3,1) both}
  @keyframes floatin{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
  .fbob{animation:bob 7s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  .fbook{
    position:relative;width:min(300px,62vw);aspect-ratio:284/436;
    transform-style:preserve-3d;
    transform:rotateY(-26deg) rotateX(4deg) rotateZ(-5deg);
  }
  .fbook .f{position:absolute;backface-visibility:hidden}
  .fbook .cover{inset:0;transform:translateZ(15px);overflow:hidden;border-radius:2px}
  .fbook .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .fbook .cover::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);
    background:linear-gradient(115deg, rgba(255,255,255,.18), rgba(255,255,255,0) 30%, rgba(0,0,0,.05) 90%)}
  .fbook .sp{
    top:0;bottom:0;left:0;width:30px;
    transform-origin:left center;transform:translateZ(-15px) rotateY(-90deg);
    display:flex;align-items:center;justify-content:center;border-radius:2px 0 0 2px;
  }
  .fbook .sp::after{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.22),rgba(255,255,255,.08));box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}
  .fbook .sp b{writing-mode:vertical-rl;font-family:var(--serif);font-weight:400;font-size:.72rem;letter-spacing:.26em;white-space:nowrap}
  .fbook .pg{
    top:3px;bottom:3px;right:0;width:28px;
    transform-origin:right center;transform:translateZ(-14px) rotateY(90deg);
    background:repeating-linear-gradient(to right,#fff 0 2px,#E7E4DB 2px 3px);
  }
  .fbook .bk{inset:0;transform:rotateY(180deg) translateZ(15px);background:#fff;border:1px solid rgba(0,0,0,.2);border-radius:2px}
  .bshadow{
    position:absolute;left:50%;bottom:-56px;width:66%;height:34px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center, rgba(0,0,0,.32), transparent 68%);
    filter:blur(5px);
  }

  .dbody h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.7rem,3.4vw,2.5rem);line-height:1.55}
  .dbody .author{font-family:var(--serif);font-style:italic;font-size:1.02rem;margin-top:.4rem;opacity:.85}
  .dbody .rule{width:44px;height:1px;background:currentColor;opacity:.7;margin:1.8rem 0}
  .dbody .blurb p{max-width:36em;font-size:.95rem}
  .dbody .blurb p+p{margin-top:1.1rem}
  .dbody .meta{font-family:var(--mono);font-size:.63rem;letter-spacing:.1em;opacity:.65;margin-top:1.6rem}
  .buyrows{margin-top:2.6rem;border:1px solid currentColor;max-width:34em}
  .buyrows a{
    display:flex;justify-content:space-between;align-items:center;gap:1rem;
    padding:.95rem 1.1rem;color:inherit;text-decoration:none;font-weight:400;font-size:.92rem;
  }
  .buyrows a+a{border-top:1px solid currentColor}
  .buyrows a:hover{background:rgba(0,0,0,.05)}
  .buyrows a .pr{font-family:var(--serif);white-space:nowrap;margin-left:auto}
  .buyrows a .ar{font-family:var(--mono)}
  .asec{margin-top:3.6rem;max-width:36em}
  .asec .lab{display:flex;align-items:center;gap:1rem;font-family:var(--serif);font-style:italic;font-size:1rem}
  .asec .lab::before{content:"";width:44px;height:1px;background:currentColor;opacity:.7}
  .asec p{margin-top:1rem;font-size:.93rem}
  .dnav{display:flex;justify-content:space-between;max-width:34em;margin-top:3rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.18em}
  .dnav button{opacity:.6;padding:.3rem 0}
  .dnav button:hover{opacity:1}

  @media (prefers-reduced-motion:reduce){
    .pbook{opacity:1;transform:none;transition:none}
    .pwrap{transition:none}
    .fwrap,.fbob{animation:none}
  }
  @media (max-width:860px){
    .detail-inner{grid-template-columns:1fr;gap:5.5rem;padding-top:7rem;align-content:start}
    .pspine .pa{display:none}
    .pspine{grid-template-columns:1fr auto;padding:0 1.1rem}
    .pbook{margin-bottom:6.5rem}
  }
</style>
</head>

</section>

const STORES = ['알라딘에서 구매','교보문고에서 구매','예스24에서 구매'];

function spineH(b){
  if(b.t.includes('키스 자렛')) return 104;
  if(b.cat==='poem') return 58;
  if(b.fm==='양장본') return 82;
  return 70;
}

const stack = document.getElementById('stack');
CATS.forEach(cat=>{
  const grp = document.createElement('p');
  grp.className='grp';
  grp.innerHTML = `${cat.no}<em>${cat.name}</em>`;
  stack.appendChild(grp);
  BOOKS.forEach((b,i)=>{
    if(b.cat!==cat.id) return;
    const el = document.createElement('button');
    el.className='pbook';
    el.dataset.i=i;
    el.setAttribute('aria-label', b.t+' 자세히 보기');
    el.innerHTML = `
      <span class="pwrap">
        <span class="ptop"><img src="${b.img}" alt="" loading="lazy"></span>
        <span class="pspine" style="--sh:${spineH(b)}px;background:${b.spine};color:${b.fg}">
          <i class="pa">${b.a.split('·')[0].trim()}</i>
          <b class="pt">${b.t}</b>
          <i class="pl">ΔT</i>
        </span>
        <span class="pedge"></span>
      </span>`;
    stack.appendChild(el);
  });
});

const io = new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} });
},{threshold:.18});
document.querySelectorAll('.pbook').forEach(b=>io.observe(b));

let current=0;
const body=document.body, el=id=>document.getElementById(id);
/* 흰 표지는 순백 대신 종이색 배경으로 */
function pageBg(hex){
  const n=parseInt(hex.slice(1),16), r=n>>16, g=(n>>8)&255, b2=n&255;
  const lum=(0.2126*r+0.7152*g+0.0722*b2)/255;
  return lum>0.93 ? '#F3F0E9' : hex;
}
function openBook(i){
  current=(i+BOOKS.length)%BOOKS.length;
  const b=BOOKS[current];
  const d=el('detail');
  d.style.setProperty('--dbg', pageBg(b.spine));
  d.style.setProperty('--dfg', b.fg);
  el('dTitle').textContent=b.t;
  el('dAuthor').textContent=b.a;
  el('dBlurb').innerHTML=(b.long? b.long : [b.desc]).map(p=>`<p>${p}</p>`).join('');
  el('dMeta').textContent=`${b.s} · 시간의흐름 · ${b.d} · ${b.fm} · ${b.extra? b.extra+' · ':''}정가 ${b.p}`;
  el('dBuy').innerHTML=STORES.map(s=>`<a href="#">${s} <span class="pr">${b.p}</span> <span class="ar">↗</span></a>`).join('');
  el('dImg').src=b.img; el('dImg').alt=b.t+' 표지';
  el('dSp').style.background=b.spine; el('dSp').style.color=b.fg;
  el('dSpT').textContent=b.t;
  if(b.bio){ el('dAsec').hidden=false; el('dBio').textContent=b.bio; }
  else{ el('dAsec').hidden=true; }
  const fw=document.querySelector('.fwrap');
  fw.style.animation='none'; void fw.offsetWidth; fw.style.animation='';
  body.classList.add('detail-mode');
  d.scrollTop=0;
  el('backBtn').focus();
}
function closeBook(){
  body.classList.remove('detail-mode');
  const s=document.querySelector(`.pbook[data-i="${current}"]`);
  if(s) s.focus();
}
stack.addEventListener('click', e=>{
  const s=e.target.closest('.pbook');
  if(s) openBook(+s.dataset.i);
});
el('backBtn').addEventListener('click', closeBook);
el('prevBtn').addEventListener('click', ()=>openBook(current-1));
el('nextBtn').addEventListener('click', ()=>openBook(current+1));
document.addEventListener('keydown', e=>{
  if(!body.classList.contains('detail-mode')) return;
  if(e.key==='Escape') closeBook();
  if(e.key==='ArrowLeft') openBook(current-1);
  if(e.key==='ArrowRight') openBook(current+1);
});
</script>
</body>
</html>
